version: '3.8'

services:

  couch-db-1:
    image: couchdb:3.3
    container_name: couch-db-1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couch-db/data
    restart: unless-stopped

  couch-db-2:
    image: couchdb:3.3
    container_name: couch-db-2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5985:5985"
    volumes:
      - couchdb-data:/opt/couch-db/data
    restart: unless-stopped


  etcd-db:
    image: gcr.io/etcd-development/etcd:v3.5.11
    container_name: etcd-db
    environment:
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-db:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    restart: unless-stopped

  fitness-app:
    build: .
    container_name: fitness-app
    ports:
      - "8080:8080"
    environment:
      - ETCD_ENDPOINTS=http://etcd-db:2379
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=cheremsha
      - COUCHDB_PASSWORD=password67
    depends_on:
      - couch-db
      - etcd-db
    restart: unless-stopped

volumes:
  couchdb-data:
